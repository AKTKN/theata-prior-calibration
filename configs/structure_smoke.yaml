# End-to-end check with a single distance and physical error rate.
distances: [3]
basis: z
rounds_per_distance: 1
physical_error_rates: [0.002]
training_shots: [1000, 10000]
test_shots: 10000
repetitions: 1
seed: 20261126
workers: 2
sample_chunk_shots: 2048
decode_chunk_shots: 2048
covariance_chunk_shots: 2048
theata_path: vendor/theata
sample_source: dem
hardware:
  compiler_options:
    cool_threshold_transversal: 1.5
  strict_lut: true
structure:
  alpha_pairs: 0.025
  alpha_singletons: 0.025
  label_mode: calibration_observables
