[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "theata-prior-calibration"
version = "0.1.0"
description = "Covariance calibration of surface-code matching priors with THeatA hardware noise"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3", "scipy>=1.10,<2", "stim>=1.16,<2",
  "pymatching>=2.4,<3", "matplotlib>=3.7,<4", "PyYAML>=6,<7",
  "threadpoolctl>=3.1,<4", "lark>=1.1,<2", "networkx>=3,<4",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6", "nbformat>=5", "nbclient>=0.10"]
test = ["pytest>=8,<10", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6"]

[project.scripts]
theata-prior = "theata_prior.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a local pinned THeatA checkout"]

